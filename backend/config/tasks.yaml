research_task:
  description: |
    Research this lead for a medical billing outreach campaign.

    LEAD (from the lead list; may be incomplete or slightly wrong):
    {lead_block}

    WEBSITE CONTENT (already scraped for you from {website}; may be empty if the site failed):
    ---
    {website_text}
    ---

    SPECIALTY PLAYBOOK. These are common billing pain points for this kind of
    practice. Treat them as hypotheses to confirm or rule out, not as facts:
    {playbook}

    HOW TO WORK:
    1. Read the website content first. It is your best source.
    2. Use the web_search tool for what the website doesn't cover. Good searches:
       - "{company}" {city} reviews billing OR insurance
       - "{company}" new location OR new provider OR opening
       - "{company}" hiring medical biller OR billing specialist OR front desk
       - "{full_name}" {company}
       Run 2 to 4 searches. Stop when you have enough. Don't burn searches on things you already know.
    3. Use scrape_website on a specific page (e.g. /insurance, /about, /careers)
       only if it would clearly add something.
    4. Confirm the person: their role, credentials (MD, DO, PA, NP, practice
       manager), and whether they are an owner or decision-maker for billing.

    STRICT RULES:
    - Never invent facts. If something isn't found, write "not found".
    - Attach a source (URL or "website") to every fact in "Personalization hooks".
    - If the lead data conflicts with what you find (wrong website, person
      no longer there, practice closed), say so clearly at the top under "WARNINGS".
    - Patient reviews that complain about billing, surprise bills, or insurance
      problems are gold. Quote them briefly with the source.
    - Job postings for billers, coders, or front desk staff are a strong buying signal. Note them.
  expected_output: |
    A markdown brief with exactly these sections:

    ## WARNINGS
    (data conflicts or "none")

    ## Practice snapshot
    - Practice name, specialty and sub-specialties
    - Number of providers (names if listed), number of locations and cities
    - Ownership: independent / group / hospital-owned / PE-backed (and source)
    - Years in operation if found

    ## The person
    - Name, title, credentials, role in the practice, decision-maker for billing? (yes / likely / unlikely)
    - Anything specific about them (training, focus areas, quotes, community involvement)

    ## Services and payer signals
    - Key services and procedures, especially ones with complex coding
    - Insurance accepted / out-of-network / cash-pay / cosmetic mix
    - Patient portal / online payment / EHR or PM software if visible

    ## Growth and change signals
    - New locations, new providers, expansions, acquisitions, hiring (with dates if found)

    ## Billing pain hypotheses (ranked, most likely first)
    For each: the hypothesis, the evidence behind it, and confidence (high/medium/low)

    ## Personalization hooks (3-5)
    Concrete, verifiable details usable in an email's first line, each with its source.
    Prefer specific and recent over generic ("added Dr. Patel and a second
    location in Frisco this year" beats "great reviews").

    ## Recommended angle
    One or two sentences: which pain + which hook the email should lead with, and why.

email_task:
  description: |
    Write a 3-email cold outreach sequence to {full_name} ({title} at {company}).

    WHAT YOU KNOW ABOUT THE LEAD:
    {research}

    SENDER PROFILE (the only source for claims about the sender):
    {sender_block}

    WHO YOU ARE WRITING TO: a physician or practice leader. Smart, busy,
    protective of their time and their patients, and tired of vendors. They
    reply to emails that feel written by a peer who genuinely gets their day:
    the charting at 9pm, the claims that come back unpaid for work already done,
    the new provider who can't bill for months. Make them think "this person
    understands my practice, and yes, I could use that."

    STEP 1, PICK THE ANGLE (think before writing):
    - Find the most specific true detail about them: a new location or
      provider, a signature procedure, their sub-specialty, their city, years
      in practice, the EHR in their Apollo "technologies" or website.
    - Pick ONE pain that detail makes likely (the playbook is hints only).
    - Pick ONE sender service that solves it: growing, new providers or
      locations -> credentialing; insurance-heavy, procedures, many payers ->
      eligibility checks and denial fixes; provider-led small practice, long
      charting -> medical scribing.
    - If they use one of the sender's ehr_systems, mention it once, naturally.

    SUBJECT LINE (the most important line; decide it last, after the body):
    - 3-6 words, sentence case, about THEM, specific enough that it could only
      go to this practice. It should read like a note from a colleague, spark
      mild curiosity, and never sound like an ad.
    - Strong shapes (fill in with THIS lead's own details; never reuse these
      words): "Dr. <Last name>, the <their new thing>" / "a thought on <their
      office or location>" / "<their procedure> and <the pain>" / "<the pain
      in their words>?".
    - If they are a physician, use "Dr. <Last name>", never their first name.
    - Never: "Quick question", "Partnership", "Billing services", "Re:",
      anything with the sender's company name, ALL CAPS, "!" or "?" tricks.
    - Write 3 options in your head; use the best as `subject` and list the
      other two in personalization_notes as "Other subjects: ... | ...".

    EMAIL 1 (body 60-95 words, excluding greeting and sign-off):
    - "Hi Dr. <Last name>," if they are an MD/DO, else "Hi {first_name},".
    - Opener (1 sentence): warm and specific to them. Notice something real
      and say why it matters, like a colleague would ("Opening a third Bayou
      City office in Cypress is a big step."). No generic praise. Never start
      with "I", "My name is", "Hope", or "I came across".
    - Intro (1 sentence): who the sender is, using the sender's `intro`. Say
      "practices in <their state>" ONLY if their state is in client_states;
      otherwise say "practices across the US". Keep the team location, said
      plainly and with confidence.
    - Empathy (1 sentence): the one pain in the doctor's terms (time,
      patients, getting paid for work already done), as something that
      commonly happens, never as a criticism of them.
    - Help (1 sentence): what Clinirev does about it, concretely.
    - Ask (1 short question): easy to say yes to, following cta_style.
    - Sign-off on two lines: "<sender_name>" then "<sender_title>, <company_name>".

    EXAMPLE of the tone and shape. The practice is made up: never copy its
    facts or sentences, write fresh ones for this lead.
      Hi Dr. Moreno,

      Bringing Dr. Shah on board at Lakeview Family Medicine must already be
      easing the wait for new patients in Plano.

      I'm Dr. Anas. I run Clinirev, a medical billing company, and my team in
      Pakistan works with physician practices across the US.

      The frustrating part of a new provider is usually the gap: months of
      payer credentialing before her visits actually get paid.

      We take that credentialing off your plate start to finish, and we
      already work in athenahealth every day.

      Would a short call to map it out be useful?

      Dr. Anas
      CEO, Clinirev

    FOLLOW-UP 1 (~3 days later, same thread, 30-50 words): warm and helpful,
    one new idea or a different service that fits them. Don't repeat email 1
    or apologize for writing again.
    FOLLOW-UP 2 (~4 days after that, 25-40 words): a kind, graceful
    close-the-loop note. Offer something free and useful (a quick look at
    their denials, or a credentialing checklist for a new provider) and make
    "not now" or "talk to our office manager" easy.

    HARD RULES (all three emails):
    - Every sentence must earn its place. One idea per email.
    - NO INVENTED CLAIMS. No numbers, percentages, dollar amounts, results, or
      client names unless they are in the sender's proof_points. Never claim
      clients in a state that isn't in client_states.
    - Only offer services in the sender's services list (no prior auths,
      coding audits, patient statements, etc.).
    - Only state facts about the lead that appear in WHAT YOU KNOW above. If
      the data is thin, use their specialty and city rather than guess.
    - Never mention patient reviews, complaints, lawsuits, or public claims
      data. Never imply they are doing something wrong.
    - Never mention Apollo, lead data, or that you researched them.
    - Layout: greeting on its own line, a blank line between every paragraph,
      a blank line before the sign-off. Follow-ups also start with the same
      greeting and are signed with just the sender_name.
    - Plain text. No bullets, bold, or links (except calendar_link if set). No
      emojis. No em dashes.
    - Banned: "I hope this email finds you well", "reaching out", "reach out",
      "touch base", "circle back", "synergy", "leverage", "streamline",
      "revolutionize", "cutting-edge", "game-changer", "seamless", "unlock",
      "in today's fast-paced", "I wanted to", "just following up", "following
      up", "bump", "solutions", "I know you're busy", "make an impact", "just wanted",
      "quick addition", "no pressure".
    - If the lead looks like a poor fit (resident or fellow, employee of a large
      hospital system or national group with in-house billing, wrong person,
      closed practice), still write the emails but begin personalization_notes
      with "POOR FIT:" and the reason.
  expected_output: |
    JSON matching the EmailSequence schema: subject, body, follow_up_1_subject,
    follow_up_1_body, follow_up_2_subject, follow_up_2_body, personalization_notes
    (which detail, pain, and service you used and where the detail came from,
    then "Other subjects: ... | ...", so a human can verify before sending).
    Follow-up subjects can simply repeat `subject`; they are sent as replies.

# Used by the "new subject ideas" button (one quick model call, no research).
subject_prompt: |
  You write cold email subject lines for Dr. Anas, CEO of Clinirev (medical
  billing, credentialing, and scribing), writing to a physician or practice
  leader. Doctors get dozens of vendor emails a day. A subject line wins the
  open when it looks like a short personal note from a colleague, is clearly
  about THEIR practice, and makes them curious enough to read one line.

  THE LEAD:
  {lead}

  THE EMAIL THIS SUBJECT SITS ON (the subject must match what it talks about):
  {email}

  Write 6 subject lines, one in each style:
  1. Their thing: the specific detail from the email, 2-4 words.
     ("the Cypress opening", "your Mohs schedule")
  2. A short honest question about them, 2-5 words.
     ("credentialing for Cypress?", "who handles your denials?")
  3. Their name plus the topic. ("Dr. Clos + the new office")
  4. The pain in a doctor's own words, 2-5 words.
     ("charting at 9pm", "paid for every Mohs case")
  5. An idea for them, 2-5 words. ("an idea for Bayou City")
  6. Your wildcard: the line YOU think this doctor is most likely to open.

  RULES:
  - If they are a physician (MD/DO), call them "Dr. <Last name>", never by
    first name.
  - Lowercase except names, places, and acronyms. No "!", no emojis, no ALL CAPS.
  - Never: "quick question", "partnership", "billing services", "Clinirev",
    "Re:", "Fwd:", "free", "opportunity", "solution", "boost", "%", "$".
  - Nothing salesy, nothing clickbait, nothing that isn't true to the email.
  - Each line must be different in wording, not just word order.

  Return only JSON: {{"subjects": ["...", "...", "...", "...", "...", "..."]}}
  with the strongest one FIRST.

# Used by the per-email rewrite button. The full email_task rules are added above it.
rewrite_prompt: |
  The person reviewing this sequence did not like {which} and wants a fresh
  version. Rewrite ONLY {which}, following every rule above for it. Take a
  noticeably different approach (a different detail, pain, or service, or a
  different way of saying it) while staying true to the facts.

  THE CURRENT SEQUENCE (for context; don't repeat the other emails):
  {sequence}

  Return only JSON: {{"text": "<the new email body, with greeting and sign-off>"}}
