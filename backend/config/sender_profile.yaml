# WHO IS SENDING. Fill this in. The writer agent only uses what is written here.
# It never invents stats, clients, or guarantees, so the more real proof you
# add, the stronger the emails get.

company_name: "YOUR COMPANY NAME"
sender_name: "YOUR NAME"
sender_title: "Founder"
website: "yourcompany.com"
phone: ""
calendar_link: ""  # e.g. https://calendly.com/you/15min (leave empty to ask for a reply instead)

# One sentence: what you do and for whom.
one_liner: "We handle end-to-end medical billing and revenue cycle management for independent practices."

# Services you actually offer (the writer picks the 1 that matches the lead's pain).
services:
  - Claims submission and scrubbing
  - Denial management and appeals
  - A/R follow-up and old A/R recovery
  - Eligibility and benefits verification
  - Prior authorizations
  - Credentialing and payer enrollment
  - Patient statements and patient balance follow-up
  - Coding review (CPT, ICD-10, modifiers)

# REAL proof points only. Delete examples you can't back up.
# Leave this list empty and the writer won't claim any numbers.
proof_points: []
#  - "Cut a 4-provider dermatology group's denial rate from 14% to 5% in 90 days"
#  - "Clean claim rate above 97% across our clients"

# Pricing / risk-reversal angle, if any (e.g. "percentage of collections, no setup fee").
offer: ""

# The ask. Keep it small. Low-friction CTAs get more replies than "book a demo".
cta_style: "Ask a single yes/no question about whether a short call or a free billing audit is worth it."

# Tone notes for the writer.
tone: "Plain, peer-to-peer, specific. Sounds like a person who understands practice operations, not a marketer."
